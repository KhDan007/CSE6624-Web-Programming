<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0C1017"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FE0C8"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E2733" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="520" rx="18" fill="url(#panelGrad)"/>
  <rect x="0" y="0" width="800" height="520" rx="18" fill="url(#grid)" opacity="0.5"/>
  <rect x="1" y="1" width="798" height="518" rx="17" fill="none" stroke="#2A3341" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="34" cy="34" r="6" fill="#FF6B57"/>
  <circle cx="56" cy="34" r="6" fill="#FFB020"/>
  <circle cx="78" cy="34" r="6" fill="#4FE0C8"/>
  <text x="110" y="39" font-family="JetBrains Mono, monospace" font-size="14" fill="#8A93A3" letter-spacing="1">model_monitor.ai — live</text>
  <line x1="24" y1="58" x2="776" y2="58" stroke="#232C39" stroke-width="1"/>

  <!-- chart axes -->
  <g transform="translate(56,84)">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#2A3341" stroke-width="1.5"/>
    <line x1="0" y1="300" x2="470" y2="300" stroke="#2A3341" stroke-width="1.5"/>
    <text x="-10" y="8" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6577" text-anchor="end">1.0</text>
    <text x="-10" y="158" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6577" text-anchor="end">0.5</text>
    <text x="-10" y="306" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6577" text-anchor="end">0.0</text>

    <!-- accuracy curve -->
    <polyline points="0,280 40,255 80,240 120,205 160,190 200,160 240,150 280,120 320,108 360,92 400,78 440,64 470,58"
      fill="none" stroke="#4FE0C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- loss curve -->
    <polyline points="0,40 40,66 80,86 120,110 160,128 200,150 240,166 280,182 320,196 360,210 400,220 440,232 470,238"
      fill="none" stroke="#FFB020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="JetBrains Mono, monospace" font-size="11">
      <circle cx="486" cy="60" r="4" fill="#4FE0C8"/>
      <text x="496" y="64" fill="#B5BDC9">accuracy</text>
      <circle cx="486" cy="240" r="4" fill="#FFB020"/>
      <text x="496" y="244" fill="#B5BDC9">loss</text>
    </g>
  </g>

  <!-- mini node graph -->
  <g transform="translate(560,84)" font-family="JetBrains Mono, monospace">
    <text x="0" y="-6" font-size="11" fill="#5B6577" letter-spacing="1">NETWORK</text>
    <g stroke="#2E3849" stroke-width="1.5">
      <line x1="10" y1="20" x2="90" y2="10"/>
      <line x1="10" y1="20" x2="90" y2="50"/>
      <line x1="10" y1="20" x2="90" y2="90"/>
      <line x1="10" y1="60" x2="90" y2="10"/>
      <line x1="10" y1="60" x2="90" y2="50"/>
      <line x1="10" y1="60" x2="90" y2="90"/>
      <line x1="10" y1="100" x2="90" y2="10"/>
      <line x1="10" y1="100" x2="90" y2="50"/>
      <line x1="10" y1="100" x2="90" y2="90"/>
      <line x1="90" y1="10" x2="170" y2="50"/>
      <line x1="90" y1="50" x2="170" y2="50"/>
      <line x1="90" y1="90" x2="170" y2="50"/>
    </g>
    <g fill="#0F141C" stroke="#4FE0C8" stroke-width="2">
      <circle cx="10" cy="20" r="7"/><circle cx="10" cy="60" r="7"/><circle cx="10" cy="100" r="7"/>
    </g>
    <g fill="#0F141C" stroke="#FFB020" stroke-width="2">
      <circle cx="90" cy="10" r="7"/><circle cx="90" cy="50" r="7"/><circle cx="90" cy="90" r="7"/>
    </g>
    <g fill="#0F141C" stroke="#E8ECF1" stroke-width="2">
      <circle cx="170" cy="50" r="8"/>
    </g>
  </g>

  <!-- stat widgets -->
  <g transform="translate(560,230)">
    <rect x="0" y="0" width="184" height="70" rx="8" fill="#0F141C" stroke="#232C39"/>
    <text x="14" y="26" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6577" letter-spacing="1">EPOCH</text>
    <text x="14" y="52" font-family="Unbounded, sans-serif" font-size="22" fill="#E8ECF1">128</text>

    <rect x="0" y="84" width="184" height="70" rx="8" fill="#0F141C" stroke="#232C39"/>
    <text x="14" y="110" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6577" letter-spacing="1">F1 SCORE</text>
    <text x="14" y="136" font-family="Unbounded, sans-serif" font-size="22" fill="#4FE0C8">0.942</text>
  </g>

  <line x1="24" y1="402" x2="776" y2="402" stroke="#232C39" stroke-width="1"/>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6577">
    <rect x="24" y="424" width="10" height="10" fill="#4FE0C8"/>
    <text x="42" y="433">status: training</text>
    <rect x="180" y="424" width="10" height="10" fill="#FFB020"/>
    <text x="198" y="433">gpu: 71% util</text>
    <rect x="330" y="424" width="10" height="10" fill="#2E3849"/>
    <text x="348" y="433">batch: 64</text>
  </g>
</svg>
